[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchshield"
version = "0.2.0"
description = "Anti-cheating audit and isolated evaluation sandbox for AI agent benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "benchmark", "evaluation", "security", "reinforcement-learning",
            "swe-bench", "terminal-bench", "llm-as-judge", "prompt-injection", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
benchshield = "benchshield.__main__:main"

[tool.setuptools.packages.find]
include = ["benchshield*"]
